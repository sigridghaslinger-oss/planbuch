<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planbuch</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planbuch">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FBFAFE">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
/* Layout: ruhige, helle Arbeitsfläche – Seitenleiste links (unten auf schmalen Geräten), Inhalt in hellen Flächen, Kursfarben als Pastell-Akzente */
:root{
  color-scheme: light;
  --bg:#FBFAFE; --surface:#FFFFFF; --soft:#F4F2FB; --line:#E6E3F1; --line-strong:#D3CFE4;
  --ink:#2F3149; --muted:#767B96; --faint:#A3A7BD;
  --tuerkis:#5BBFBC; --tuerkis-ink:#1F6E6B; --tuerkis-bg:#DDF4F3;
  --koralle:#F09486; --koralle-ink:#9A3F33; --koralle-bg:#FDE4E0;
  --lila:#B49AE6; --lila-ink:#5B3F94; --lila-bg:#EEE7FB;
  --mint:#86D3AC; --mint-ink:#2C7352; --mint-bg:#DFF5E9;
  --rosa:#EFA3C3; --rosa-ink:#94385F; --rosa-bg:#FCE6F0;
  --blau:#8DB8EC; --blau-ink:#2D5A91; --blau-bg:#E1EDFC;
  --pfirsich:#F2B47E; --pfirsich-ink:#8E5320; --pfirsich-bg:#FDEBDB;
  --sonne:#E8CF6A; --sonne-ink:#7A6413; --sonne-bg:#FBF3D3;
  --sand:#C9B39A; --sand-ink:#6B5440; --sand-bg:#F1EAE1;
  --grau:#B4B8C8; --grau-ink:#4F546A; --grau-bg:#EDEEF3;
  --accent:var(--tuerkis); --accent-ink:var(--tuerkis-ink); --accent-bg:var(--tuerkis-bg);
  --warn:var(--koralle); --warn-ink:var(--koralle-ink); --warn-bg:var(--koralle-bg);
  --font-display:"Lexend", "Avenir Next", system-ui, sans-serif;
  --font-body:"Nunito Sans", "Avenir Next", system-ui, -apple-system, sans-serif;
  --r:12px; --r-sm:8px;
  --shadow:0 1px 2px rgba(60,50,110,.05), 0 4px 16px rgba(60,50,110,.06);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-display);font-weight:500;margin:0;line-height:1.25;text-wrap:balance}
h1{font-size:1.45rem} h2{font-size:1.12rem} h3{font-size:.98rem}
a{color:var(--accent-ink)}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* App-Rahmen */
.app{display:grid;grid-template-columns:220px 1fr;height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:max(18px,env(safe-area-inset-top)) 12px 16px max(12px,env(safe-area-inset-left));gap:4px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.brand svg{flex:none}
.brand b{font-family:var(--font-display);font-weight:600;font-size:1.15rem;letter-spacing:.01em}
.brand small{display:block;color:var(--muted);font-size:.75rem}
.nav{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;border:0;background:none;cursor:pointer;text-align:left;color:var(--ink);font-weight:600;width:100%}
.nav svg{width:20px;height:20px;flex:none;stroke:var(--muted)}
.nav:hover{background:var(--soft)}
.nav.on{background:var(--accent-bg);color:var(--accent-ink)}
.nav.on svg{stroke:var(--accent-ink)}
.side .spacer{flex:1}
.savebox{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:8px;font-size:.85rem;margin-top:12px}
.savebox.dirty{border-color:var(--koralle);background:var(--koralle-bg)}
.savebox .st{display:flex;align-items:center;gap:8px;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mint);flex:none}
.dirty .dot{background:var(--koralle)}
.main{overflow-y:auto;min-width:0;-webkit-overflow-scrolling:touch}
.page{padding-block:max(20px,env(safe-area-inset-top)) 40px;padding-left:max(24px,env(safe-area-inset-left));padding-right:max(24px,env(safe-area-inset-right));max-width:1500px;margin:0 auto;display:grid;gap:18px}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.head .l{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-width:0}
.sub{color:var(--muted);font-size:.9rem}

/* Bausteine */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:.9rem;white-space:nowrap;color:var(--ink)}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--tuerkis-ink)}
.btn.warn{background:var(--koralle);border-color:var(--koralle);color:#fff}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--soft)}
.btn.sm{padding:4px 10px;font-size:.82rem}
.btn.icon{padding:6px;border-radius:50%;width:34px;height:34px;justify-content:center}
.btn svg{width:17px;height:17px;stroke:currentColor}
.btn:disabled{opacity:.45;cursor:default}
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:999px;padding:5px 12px;font-weight:600;font-size:.85rem;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:7px 10px;background:var(--surface);min-width:0;max-width:100%}
textarea{width:100%;resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-bg);border-color:var(--accent)}
label.f{display:grid;gap:4px;font-size:.82rem;color:var(--muted);font-weight:600}
label.f > input,label.f > select,label.f > textarea{color:var(--ink);font-weight:400;font-size:.95rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 11px;font-weight:700;font-size:.82rem;background:var(--c-bg);color:var(--c-ink);border:1px solid transparent;cursor:pointer;white-space:nowrap}
.chip.off{background:var(--surface);border-color:var(--line);color:var(--muted)}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c-line)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.75rem;font-weight:700;background:var(--soft);color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:28px 12px;font-size:.92rem}
.rte{line-height:1.5;font-size:.93rem}
.rte p{margin:0 0 6px}.rte ul,.rte ol{margin:0 0 6px;padding-left:20px}
.rte:empty::before{content:attr(data-ph);color:var(--faint)}
[contenteditable]{outline:none;border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:8px 10px;min-height:60px;background:var(--surface)}
[contenteditable]:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.kicker{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.c-tuerkis{--c-line:var(--tuerkis);--c-ink:var(--tuerkis-ink);--c-bg:var(--tuerkis-bg)}
.c-koralle{--c-line:var(--koralle);--c-ink:var(--koralle-ink);--c-bg:var(--koralle-bg)}
.c-lila{--c-line:var(--lila);--c-ink:var(--lila-ink);--c-bg:var(--lila-bg)}
.c-mint{--c-line:var(--mint);--c-ink:var(--mint-ink);--c-bg:var(--mint-bg)}
.c-rosa{--c-line:var(--rosa);--c-ink:var(--rosa-ink);--c-bg:var(--rosa-bg)}
.c-blau{--c-line:var(--blau);--c-ink:var(--blau-ink);--c-bg:var(--blau-bg)}
.c-pfirsich{--c-line:var(--pfirsich);--c-ink:var(--pfirsich-ink);--c-bg:var(--pfirsich-bg)}
.c-sonne{--c-line:var(--sonne);--c-ink:var(--sonne-ink);--c-bg:var(--sonne-bg)}
.c-sand{--c-line:var(--sand);--c-ink:var(--sand-ink);--c-bg:var(--sand-bg)}
.c-grau{--c-line:var(--grau);--c-ink:var(--grau-ink);--c-bg:var(--grau-bg)}

/* Heute */
.today{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
.lessonhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.lessonhead .time{font-family:var(--font-display);font-size:1.05rem}
.bigchip{font-family:var(--font-display);font-weight:600;font-size:1.05rem;padding:6px 14px;border-radius:12px;background:var(--c-bg);color:var(--c-ink)}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.today.wide{grid-template-columns:1fr}
.mx-wrap{position:relative}
.mx-wrap::after{content:'';position:absolute;top:0;right:0;bottom:0;width:28px;pointer-events:none;background:linear-gradient(to right,transparent,var(--surface));opacity:0;transition:opacity .2s}
.mx-wrap.more::after{opacity:1}
#mx{scrollbar-width:thin;padding-bottom:4px}
#mx::-webkit-scrollbar{height:8px}#mx::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:8px}
#mx table.st .nm{position:sticky;left:0;z-index:2;background:var(--surface);box-shadow:1px 0 0 var(--line)}
#mx table.st thead .nm{z-index:3}
#mx.scrolled table.st .nm{box-shadow:4px 0 8px -4px rgba(47,49,73,.25)}
#mx .nm .n{display:inline-block;min-width:20px;color:var(--faint);font-variant-numeric:tabular-nums;font-size:.8rem}
table.st{border-collapse:separate;border-spacing:0;width:100%;font-size:.9rem}
table.st th,table.st td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap}
table.st thead th{font-size:.75rem;color:var(--muted);font-weight:700;position:sticky;top:0;background:var(--surface);z-index:1;vertical-align:bottom}
table.st td.n{color:var(--faint);width:28px;font-variant-numeric:tabular-nums}
table.st td.cell{text-align:center;padding:3px;width:52px}
.mark{width:42px;height:32px;border-radius:8px;border:1px dashed var(--line-strong);background:var(--surface);cursor:pointer;font-weight:700;font-size:1rem;display:inline-flex;align-items:center;justify-content:center}
.mark.set{border-style:solid;border-color:transparent}
.m-good{background:var(--mint-bg);color:var(--mint-ink)}
.m-mid{background:var(--sonne-bg);color:var(--sonne-ink)}
.m-bad{background:var(--koralle-bg);color:var(--koralle-ink)}
.m-info{background:var(--blau-bg);color:var(--blau-ink)}
.m-lila{background:var(--lila-bg);color:var(--lila-ink)}
.m-grey{background:var(--grau-bg);color:var(--grau-ink)}
.vth{writing-mode:vertical-rl;transform:rotate(180deg);max-height:140px;text-align:left;font-size:.78rem}
.lessonbox{display:grid;gap:12px}
.field-title{font-size:.75rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.unitline{font-size:.85rem;color:var(--muted)}
.reminders li{display:flex;gap:8px;align-items:center}

/* Kalender */
.cal-wrap{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:18px;align-items:start}
.week{display:grid;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden;min-width:640px}
.week .h{background:var(--soft);padding:8px;font-weight:700;font-size:.85rem;text-align:center;border-bottom:1px solid var(--line)}
.week .h.today{background:var(--accent-bg);color:var(--accent-ink)}
.week .p{padding:6px 4px;text-align:center;border-bottom:1px solid var(--line);font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;flex-direction:column;justify-content:center}
.week .p b{font-family:var(--font-display);font-size:1rem;color:var(--ink);font-weight:500}
.week .c{border-bottom:1px solid var(--line);border-left:1px solid var(--line);padding:3px;min-height:58px;display:grid;gap:3px;align-content:start}
.week .c.vac{background:repeating-linear-gradient(135deg,var(--soft) 0 6px,var(--surface) 6px 12px)}
.week .ev{border-left:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;display:grid;gap:3px;align-content:start;min-height:34px}
.les{border-radius:8px;padding:5px 7px;background:var(--c-bg);color:var(--c-ink);border-left:4px solid var(--c-line);cursor:pointer;font-size:.8rem;line-height:1.3;text-align:left;border-top:0;border-right:0;border-bottom:0;width:100%}
.les b{display:block;font-size:.78rem}
.les span{display:block;color:var(--ink);opacity:.85;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.les.done{opacity:.6}
.les.cancel{background:var(--surface);border-left-color:var(--line-strong);color:var(--faint);text-decoration:line-through}
.evt{border-radius:6px;padding:2px 6px;font-size:.75rem;background:var(--lila-bg);color:var(--lila-ink);cursor:pointer;border:0;text-align:left;width:100%;line-height:1.3}
.evt.vacation{background:var(--mint-bg);color:var(--mint-ink);font-weight:700}
.evt.supervision{background:var(--blau-bg);color:var(--blau-ink)}
.evt.private{background:var(--rosa-bg);color:var(--rosa-ink)}
.week .c .evt{padding:4px 6px}
.week .add{border:1px dashed transparent;background:none;border-radius:6px;color:var(--faint);font-size:.8rem;min-height:22px;cursor:pointer;opacity:0;transition:opacity .15s}
.week .c:hover .add,.week .ev:hover .add,.week .add:focus-visible{opacity:1;border-color:var(--line)}
@media (hover:none){.week .add{opacity:.45}}
.evt.consultation{background:var(--sonne-bg);color:var(--sonne-ink)}
.mini{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:.78rem;text-align:center}
.mini .wd{color:var(--faint);font-weight:700;padding:3px 0}
.mini button{border:0;background:none;border-radius:8px;padding:5px 0;cursor:pointer;font-variant-numeric:tabular-nums}
.mini button.out{color:var(--faint)}
.mini button.wk{background:var(--accent-bg)}
.mini button.td{background:var(--accent);color:#fff;font-weight:700}
.mini button.vac{color:var(--mint-ink);text-decoration:underline;text-decoration-color:var(--mint)}

/* Unterricht */
.plan{display:grid;grid-template-columns:minmax(260px,330px) minmax(0,1fr);gap:18px;align-items:start}
.dist{max-height:calc(100vh - 210px);overflow-y:auto;padding:6px}
.dist .d{display:grid;grid-template-columns:62px 1fr auto;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;font-size:.85rem;cursor:pointer}
.dist .d:hover{background:var(--soft)}
.dist .d.cur{background:var(--accent-bg)}
.dist .d .dt{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.8rem;line-height:1.2}
.dist .d .dt b{color:var(--ink);font-weight:700}
.dist .d.cancel{color:var(--faint);text-decoration:line-through}
.dist .d.free .t{color:var(--faint);font-style:italic}
.dist .sep{font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;padding:10px 8px 4px}
.unit{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.unit+.unit{margin-top:10px}
.unit .uh{display:flex;align-items:center;gap:6px 10px;padding:10px 12px;background:var(--c-bg);flex-wrap:wrap}
.unit .uh .pill{white-space:nowrap}
.unit .uh input{flex:1 1 200px;border:0;background:transparent;font-family:var(--font-display);font-weight:500;font-size:1rem;color:var(--c-ink);padding:4px 6px;border-radius:6px;min-width:120px}
.unit .uh input:focus{background:var(--surface);outline:none}
#pop{position:fixed;z-index:60;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:grid;min-width:230px}
#pop button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:10px 12px;border-radius:8px;font:inherit;color:var(--ink);text-align:left;cursor:pointer}
#pop button:hover{background:var(--soft)}
#pop button.danger{color:var(--koralle-ink)}
#pop hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.movebar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--accent-bg);color:var(--accent-ink);border-radius:var(--r);padding:10px 14px;font-weight:600}
.slot{display:block;width:100%;border:2px dashed var(--accent);background:var(--surface);color:var(--accent-ink);border-radius:8px;padding:6px;margin:4px 0;font:inherit;font-size:.85rem;font-weight:600;cursor:pointer}
.slot:hover{background:var(--accent-bg)}
.lrow.moving{background:var(--accent-bg);opacity:.6}
.ledit-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:space-between;position:sticky;top:0;z-index:2;background:var(--soft);padding:4px 0 8px;border-bottom:1px solid var(--line)}
.lrow .drag{width:22px;height:30px;display:grid;place-items:center;color:var(--faint);cursor:grab;touch-action:none;border:0;background:none;padding:0;border-radius:6px}
.lrow .drag:hover{color:var(--muted);background:var(--surface)}
.lrow.dragging{opacity:.45}
.lrow.drop-before{box-shadow:inset 0 3px 0 var(--accent)}
.lrow.drop-after{box-shadow:inset 0 -3px 0 var(--accent)}
.uh.drop-into{box-shadow:inset 0 -3px 0 var(--accent)}
body.is-dragging{cursor:grabbing;user-select:none;-webkit-user-select:none}
.lrow{display:grid;grid-template-columns:22px 28px 1fr auto;gap:8px;align-items:center;padding:7px 12px;border-top:1px solid var(--line)}
.lrow .lt{display:flex;flex-direction:column;min-width:0;cursor:pointer}
.lrow .lt b{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.lrow .lt small{color:var(--muted);font-size:.78rem}
.lrow.open{background:var(--soft)}
.lrow.buffer .lt b,.les.buffer span,.dist .d.buffer .t{color:var(--faint);font-style:italic}
.ledit .ledit-x{position:absolute;top:6px;right:6px}
.ledit{position:relative;padding:12px;border-top:1px dashed var(--line-strong);background:var(--soft);display:grid;gap:10px}
.check{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-strong);background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0}
.check.on{background:var(--mint);border-color:var(--mint)}
.check.on::after{content:"";width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.len{display:inline-flex;align-items:center;gap:2px;font-size:.8rem;color:var(--muted)}
.len button{border:1px solid var(--line);background:var(--surface);border-radius:6px;width:22px;height:22px;cursor:pointer;line-height:1;padding:0}
.stat{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.stat b{color:var(--ink);font-family:var(--font-display);font-weight:500;font-size:1.05rem}
.bar{height:6px;background:var(--soft);border-radius:4px;overflow:hidden;min-width:120px;flex:1}
.bar i{display:block;height:100%;background:var(--mint)}

/* Drawer / Dialog */
.scrim{position:fixed;inset:0;background:rgba(47,49,73,.25);z-index:50;display:flex;justify-content:flex-end}
.drawer{width:min(480px,100%);height:100%;background:var(--surface);box-shadow:-8px 0 30px rgba(47,49,73,.12);overflow-y:auto;padding:max(20px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) 20px;display:grid;gap:14px;align-content:start}
.drawer .dh{display:flex;align-items:start;justify-content:space-between;gap:10px}
.dialog{margin:auto;width:min(440px,calc(100% - 32px));background:var(--surface);border-radius:16px;padding:20px;display:grid;gap:14px;box-shadow:0 20px 50px rgba(47,49,73,.2)}

<body>
<div class="app">

<script>
'use strict';
/* ---------- Hilfsfunktionen ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const weekday = s => { const w = parse(s).getDay(); return w === 0 ? 7 : w; };
const monday = s => addDays(s, 1 - weekday(s));
const todayIso = () => iso(new Date());
const schoolWeek = () => { const t = todayIso(); return weekday(t) >= 6 ? addDays(monday(t), 7) : monday(t); };
const nowHM = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const WD = ['', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
const WDL = ['', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag', 'Sonntag'];
const MON = ['Jänner', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
const dm = s => { const d = parse(s); return `${d.getDate()}.${d.getMonth() + 1}.`; };
const dmy = s => { const d = parse(s); return `${d.getDate()}.${d.getMonth() + 1}.${d.getFullYear()}`; };
const longDate = s => `${WDL[weekday(s)]}, ${parse(s).getDate()}. ${MON[parse(s).getMonth()]}`;
const kw = s => { const d = parse(s); d.setDate(d.getDate() + 4 - (d.getDay() || 7)); const y = new Date(d.getFullYear(), 0, 1); return Math.ceil(((d - y) / 864e5 + 1) / 7); };
const weeksBetween = (a, b) => Math.round((parse(b) - parse(a)) / (7 * 864e5));
const COLORS = ['tuerkis', 'koralle', 'lila', 'mint', 'rosa', 'blau', 'pfirsich', 'sonne', 'sand', 'grau'];
const COLOR_NAMES = { tuerkis: 'Türkis', koralle: 'Koralle', lila: 'Lila', mint: 'Mint', rosa: 'Rosa', blau: 'Blau', pfirsich: 'Pfirsich', sonne: 'Sonne', sand: 'Sand', grau: 'Grau' };
const EVENT_TYPES = { school: 'Schultermin', supervision: 'Aufsicht', consultation: 'Sprechstunde', private: 'Privat', other: 'Sonstiges', vacation: 'Ferien / schulfrei' };
const MARK_STYLES = { good: 'Grün', mid: 'Gelb', bad: 'Koralle', info: 'Blau', lila: 'Lila', grey: 'Grau' };
const stripHtml = h => { const t = document.createElement('div'); t.innerHTML = h || ''; return t.textContent.trim(); };

function sanitize(html) {
  const t = document.createElement('template');
  t.innerHTML = html || '';
  const ok = { P: 1, UL: 1, OL: 1, LI: 1, B: 1, STRONG: 1, I: 1, EM: 1, U: 1, BR: 1, A: 1 };
  (function walk(n) {
    [...n.childNodes].forEach(c => {
      if (c.nodeType === 1) {
        if (['SCRIPT', 'STYLE', 'IFRAME', 'OBJECT', 'EMBED', 'svg'].includes(c.tagName)) { c.remove(); return; }
        walk(c);
        if (!ok[c.tagName]) {
          if (c.tagName === 'DIV') { const p = document.createElement('p'); p.append(...c.childNodes); c.replaceWith(p); }
          else c.replaceWith(...c.childNodes);
          return;
        }
        [...c.attributes].forEach(a => { if (!(c.tagName === 'A' && a.name === 'href' && /^https?:/i.test(a.value))) c.removeAttribute(a.name); });
        if (c.tagName === 'A') { c.setAttribute('target', '_blank'); c.setAttribute('rel', 'noopener'); }
      } else if (c.nodeType !== 3) c.remove();
    });
  })(t.content);
  return t.innerHTML.replace(/<p>\s*<\/p>/g, '').trim();
}

const I = {
  today: '<path d="M12 3v2M12 19v2M5 12H3M21 12h-2M6.3 6.3 4.9 4.9M19.1 19.1l-1.4-1.4M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/><circle cx="12" cy="12" r="4"/>',
  cal: '<rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  plan: '<path d="M5 4h11l3 3v13H5z"/><path d="M9 10h6M9 14h6M9 18h3"/>',
  people: '<circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9" r="2.4"/><path d="M15.5 14.2c2.3.2 4 1.8 4.5 4.8"/>',
  note: '<path d="M6 3.5h9l3.5 3.5v13.5H6z"/><path d="M9 11h6M9 15h4"/>',
  bell: '<path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/>',
  print: '<path d="M7 9V4h10v5"/><rect x="4" y="9" width="16" height="8" rx="2"/><path d="M7 14h10v6H7z"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/>',
  left: '<path d="m15 5-7 7 7 7"/>', right: '<path d="m9 5 7 7-7 7"/>',
  plus: '<path d="M12 5v14M5 12h14"/>', x: '<path d="M6 6l12 12M18 6 6 18"/>',
  up: '<path d="m6 15 6-6 6 6"/>', down: '<path d="m6 9 6 6 6-6"/>',
  trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  check: '<path d="m5 12 5 5 9-10"/>',
  more: '<circle cx="5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.6" fill="currentColor" stroke="none"/>',
  copy: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',
  grip: '<circle cx="9" cy="6" r="1.3" fill="currentColor" stroke="none"/><circle cx="15" cy="6" r="1.3" fill="currentColor" stroke="none"/><circle cx="9" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="15" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="9" cy="18" r="1.3" fill="currentColor" stroke="none"/><circle cx="15" cy="18" r="1.3" fill="currentColor" stroke="none"/>',
  lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  undo: '<path d="M9 7 4 12l5 5"/><path d="M4 12h10a6 6 0 0 1 0 12h-2" transform="translate(0 -6)"/>',
  cloud: '<path d="M7 18h10a4 4 0 0 0 .6-8A6 6 0 0 0 6.2 9 4.5 4.5 0 0 0 7 18z"/><path d="M12 11v5M9.5 13.5 12 16l2.5-2.5"/>',
  open: '<path d="M7 18h10a4 4 0 0 0 .6-8A6 6 0 0 0 6.2 9 4.5 4.5 0 0 0 7 18z"/><path d="M12 16v-5M9.5 13.5 12 11l2.5 2.5"/>',
  edit: '<path d="M4 20h4L19 9l-4-4L4 16z"/>',
  grade: '<path d="M5 4h14v16H5z"/><path d="M8.5 9h7M8.5 13h7M8.5 17h4"/><circle cx="16" cy="17" r="0"/>',
  home: '<path d="M4 11 12 4l8 7"/><path d="M6 10v9h12v-9"/><path d="M10 19v-5h4v5"/>',
  child: '<circle cx="12" cy="8" r="3.6"/><path d="M5 20c.8-3.8 3.6-6 7-6s6.2 2.2 7 6"/>',
};
const icon = (n, cls = '') => `<svg class="${cls}" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;

/* ---------- Daten & Speicher ---------- */
let D = null;            // alle Daten
let version = 0;         // steigt bei jeder Änderung (für Zwischenspeicher)
const meta = { changedAt: null, fileSavedAt: null, fileName: null };
const undoStack = [];
const ui = { view: 'heute', courseId: null, classId: null, week: null, focusKey: null, openLesson: null, openUnits: {}, print: { kind: 'liste', mode: 'blanko', cols: 10, rows: 25, headers: '', title: '', orient: 'portrait', detail: 'voll', week: null, colId: null }, noteId: null, studentCourse: null };

const idb = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('planbuch', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => { const t = db.transaction('kv', mode); const st = t.objectStore('kv'); const q = fn(st); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); }); };
  return { get: k => tx('readonly', s => s.get(k)), set: (k, v) => tx('readwrite', s => s.put(v, k)), del: k => tx('readwrite', s => s.delete(k)) };
})();

/* ---------- Passwort & Verschlüsselung ----------
   Alle Daten werden mit AES-GCM verschlüsselt, der Schlüssel entsteht per PBKDF2 aus dem Passwort.
   Unverschlüsselt liegen die Daten nur im Arbeitsspeicher, solange die App entsperrt ist. */
const PBKDF2_ITER = 310000;
const vault = { key: null, salt: null, iter: PBKDF2_ITER };
const te = new TextEncoder(), td = new TextDecoder();
const toB64 = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
const fromB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(pw, salt, iter) {
  const base = await crypto.subtle.importKey('raw', te.encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function seal(obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, vault.key, te.encode(JSON.stringify(obj))));
  return { app: 'planbuch', enc: 'aes-gcm', kdf: 'pbkdf2-sha256', iter: vault.iter, salt: toB64(vault.salt), iv: toB64(iv), data: toB64(ct) };
}
async function unseal(box, key) { return JSON.parse(td.decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(box.iv) }, key, fromB64(box.data)))); }
// wirft einen Fehler, wenn das Passwort nicht passt
async function openBox(box, pw) { const salt = fromB64(box.salt); const key = await deriveKey(pw, salt, box.iter); return { obj: await unseal(box, key), key, salt, iter: box.iter }; }
async function newVault(pw) { vault.salt = crypto.getRandomValues(new Uint8Array(16)); vault.iter = PBKDF2_ITER; vault.key = await deriveKey(pw, vault.salt, vault.iter); }
const sameVault = box => vault.key && vault.salt && box.salt === toB64(vault.salt) && box.iter === vault.iter;

let saveTimer = null;
let fileCache = { v: -1, json: null };   // fertig verschlüsselte Datei, damit „Sichern“ am iPad sofort teilen kann
function persist() { clearTimeout(saveTimer); saveTimer = setTimeout(flushPersist, 250); }
async function flushPersist() {
  clearTimeout(saveTimer); saveTimer = null;
  if (!D) return;
  if (!vault.key) { needPassword(); return; }
  const v = version;
  const box = JSON.stringify(await seal({ D, meta }));
  fileCache = { v, json: JSON.stringify(await seal({ ...D, savedAt: new Date().toISOString() })) };
  try {
    await idb.set('data', box); await idb.del('meta').catch(() => { });
    try { localStorage.removeItem('planbuch-data'); localStorage.removeItem('planbuch-meta'); } catch (e) { }
  } catch (e) {
    try { localStorage.setItem('planbuch-data', box); localStorage.removeItem('planbuch-meta'); } catch (_) { toast('Speichern auf diesem Gerät ist fehlgeschlagen. Bitte auf OneDrive sichern.'); }
  }
}
async function readLocal() {
  let d = null, m = null;
  try { d = await idb.get('data'); m = await idb.get('meta'); } catch (e) { /* weiter mit localStorage */ }
  if (!d) try { d = localStorage.getItem('planbuch-data'); m = localStorage.getItem('planbuch-meta'); } catch (e) { }
  if (!d) return null;
  const o = JSON.parse(d);
  return o.enc ? { box: o } : { plain: o, meta: m ? JSON.parse(m) : {} };
}

/* Passwort-Bildschirm: deckt die ganze App ab */
function pwScreen({ title, text, fields, button, submit, cancel, extra }) {
  $('#lock')?.remove();
  const el = document.createElement('div'); el.id = 'lock';
  el.innerHTML = `<form class="card" autocomplete="on">
    <div class="brand welcome-brand" style="padding:0"><svg width="44" height="44" viewBox="0 0 34 34"><rect width="34" height="34" rx="10" fill="var(--tuerkis-bg)"/><rect x="8" y="9" width="18" height="17" rx="3" fill="none" stroke="var(--tuerkis-ink)" stroke-width="1.8"/><path d="M8 14h18" stroke="var(--tuerkis-ink)" stroke-width="1.8"/><circle cx="13" cy="19.5" r="1.8" fill="var(--koralle)"/><circle cx="18.5" cy="19.5" r="1.8" fill="var(--lila)"/></svg><div><b style="font-size:1.3rem">${title}</b><small>Planbuch</small></div></div>
    ${text ? `<p style="margin:0">${text}</p>` : ''}
    <input type="text" name="username" value="Planbuch" autocomplete="username" hidden>
    ${fields.map(([n, l, ac]) => `<label class="f">${l}<input type="password" name="${n}" autocomplete="${ac}" required></label>`).join('')}
    <p class="err" role="alert"></p>
    <div class="row" style="justify-content:space-between"><button class="btn primary">${button}</button>${cancel ? '<button type="button" class="btn ghost" data-x="cancel">Abbrechen</button>' : ''}</div>
    ${extra || ''}</form>`;
  document.body.append(el);
  const form = el.querySelector('form'), err = el.querySelector('.err'), btn = form.querySelector('.btn.primary');
  setTimeout(() => form.querySelector('input[type=password]')?.focus(), 50);
  form.addEventListener('submit', async ev => {
    ev.preventDefault(); ev.stopPropagation();

/* ---------- Ansicht: Kinder (Schülerprofil für den Elternsprechtag) ---------- */
const nkey = s => `${s.first} ${s.last}`.toLowerCase().split(/[\s,]+/).filter(Boolean).sort().join(' ');
function allChildren() {
  const m = new Map();
  D.classes.forEach(k => k.students.forEach(s => {
    const key = nkey(s); if (!key.trim()) return;
    if (!m.has(key)) m.set(key, { key, s, recs: [] });
    m.get(key).recs.push({ cls: k, s });
  }));
  return [...m.values()].sort((a, b) => (a.s.last + a.s.first).localeCompare(b.s.last + b.s.first, 'de'));
}
const ATT = { a: ['fehlt', 'bad'], e: ['entschuldigt', 'info'], l: ['verspätet', 'mid'] };
function childCourses(ch) {
  const out = [];
  ch.recs.forEach(({ cls, s }) => D.courses.filter(c => courseStudents(c).some(x => x.id === s.id)).forEach(c => out.push({ c, s, cls })));
  return out;
}
const STYLE_COLOR = { good: 'var(--mint)', mid: 'var(--sonne)', bad: 'var(--koralle)', info: 'var(--blau)', lila: 'var(--lila)', grey: 'var(--grau)' };
function childStats(ch) {
  const grades = [], marks = [], att = { a: 0, e: 0, l: 0, list: [] }, empty = [];
  childCourses(ch).forEach(({ c, s }) => {
    let any = false;
    if (c.grades) {
      const g = c.grades; const tot = totalGrade(g, s.id);
      const cats = g.categories.map(cat => ({ title: cat.title, weight: cat.weight, avg: catAvg(g, cat, s.id), items: cat.items.map(it => ({ title: it.title, v: g.values[it.id]?.[s.id] })).filter(x => x.v != null) })).filter(x => x.avg != null);
      if (tot != null) { grades.push({ c, tot, cats }); any = true; }
    }
    Object.keys(c.attendance).sort().forEach(d => { const v = c.attendance[d][s.id]; if (v) { att[v]++; att.list.push({ d, v, c }); any = true; } });
    c.columns.forEach(col => {
      const e = c.entries[col.id]?.[s.id] || {}; const ds = Object.keys(e).sort(); if (!ds.length) return;
      any = true;
      if (col.type === 'text') { marks.push({ c, col, text: ds.map(d => ({ d, v: e[d] })) }); return; }
      const cnt = {}; ds.forEach(d => { const o = optOf(col, e[d]); if (o) cnt[o.id] = (cnt[o.id] || 0) + 1; });
      marks.push({ c, col, cnt, total: ds.length, list: ds.map(d => ({ d, o: optOf(col, e[d]) })) });
    });
    if (!any) empty.push(cname(c));
  });
  return { grades, marks, att, empty };
}
/* Grafik 1: Noten je Bereich auf der Skala 1–5 (links = besser) */
function gradeChartSvg(grades) {
  const rows = [];
  grades.forEach(g => { rows.push({ head: true, label: cname(g.c), v: g.tot }); g.cats.forEach(cat => rows.push({ label: cat.title, v: cat.avg, n: cat.items.length })); });
  const W = 520, L = 160, R = 40, top = 26, rh = 26, H = top + rows.length * rh + 6;
  const x = v => L + (Math.min(5, Math.max(1, v)) - 1) / 4 * (W - L - R);
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Noten je Bereich" style="max-width:${W}px;font-family:var(--font-body)">`;
  for (let k = 1; k <= 5; k++) svg += `<line x1="${x(k)}" x2="${x(k)}" y1="${top - 6}" y2="${H - 4}" stroke="var(--line)" stroke-dasharray="${k === 1 || k === 5 ? '' : '3 3'}"/><text x="${x(k)}" y="${top - 12}" text-anchor="middle" font-size="11" fill="var(--muted)">${k}</text>`;
  rows.forEach((r, i) => {
    const y = top + i * rh + rh / 2;
    if (r.head) svg += `<rect x="0" y="${y - rh / 2 + 2}" width="${W}" height="${rh - 4}" rx="6" fill="var(--soft)"/>`;
    svg += `<text x="${r.head ? 8 : 18}" y="${y + 4}" font-size="${r.head ? 12.5 : 12}" font-weight="${r.head ? 700 : 400}" fill="var(--ink)">${esc(r.label.length > 24 ? r.label.slice(0, 23) + '…' : r.label)}</text>`;
    svg += `<line x1="${x(1)}" x2="${x(r.v)}" y1="${y}" y2="${y}" stroke="${r.head ? 'var(--tuerkis-ink)' : 'var(--tuerkis)'}" stroke-width="2" stroke-linecap="round"/>`;
    svg += `<circle cx="${x(r.v)}" cy="${y}" r="${r.head ? 7 : 5.5}" fill="${r.head ? 'var(--tuerkis-ink)' : 'var(--tuerkis)'}" stroke="var(--surface)" stroke-width="2"><title>${esc(r.label)}: ${fmtG(r.v)}${r.n ? ` (${r.n} Note${r.n > 1 ? 'n' : ''})` : ''}</title></circle>`;
    svg += `<text x="${x(r.v) + 11}" y="${y + 4}" font-size="12" font-weight="${r.head ? 700 : 600}" fill="var(--ink)">${fmtG(r.v)}</text>`;
  });
  return svg + '</svg>';
}
/* Grafik 2: Mitschrift als gestapelte Balken (Anteile je Zeichen) */
function markChartSvg(marks) {
  const rows = marks.filter(m => m.cnt);
  const W = 520, L = 160, R = 30, rh = 30, H = rows.length * rh + 4;
  const max = Math.max(...rows.map(r => r.total), 1);

  rows.forEach((r, i) => {
    const y = i * rh + 6, h = 16; let xx = L;
    svg += `<text x="0" y="${y + 12}" font-size="12" fill="var(--ink)">${esc((r.col.title.length > 18 ? r.col.title.slice(0, 17) + '…' : r.col.title))}<tspan fill="var(--muted)" font-size="10.5"> ${esc(cname(r.c))}</tspan></text>`;

function printWeek() {
  const P = ui.print; const wk = monday(P.week || todayIso());
  const days = D.year.days.map(w => addDays(wk, w - 1)); const vac = vacSet();
  const occ = allOcc().filter(o => o.date >= wk && o.date <= addDays(wk, 6));
  let h = `<div class="ph"><div><h2>Wochenplan KW ${kw(wk)}</h2><div style="font-size:10pt;color:#555">${dmy(wk)} – ${dmy(addDays(wk, 4))}</div></div><div class="meta">${esc(D.year.title)}</div></div>`;
  h += `<table class="pt wp"><thead><tr><th class="pp">Std.</th>${days.map(d => `<th>${WDL[weekday(d)]} ${dm(d)}</th>`).join('')}</tr></thead><tbody>`;
  h += `<tr><td class="pp">Termine</td>${days.map(d => `<td>${eventsOn(d).map(e => `<div>${e.startTime && e.start === d ? e.startTime + ' ' : ''}${esc(e.title)}</div>`).join('')}</td>`).join('')}</tr>`;
  D.periods.forEach(p => {
    const any = occ.some(o => periodOf(o.start) === p.n);
    if (!any && p.n > 6) return;
    h += `<tr><td class="pp"><b>${p.n}</b><br>${p.start}<br>${p.end}</td>${days.map(d => {
      if (vac.has(d)) return '<td style="background:#f3f3f3"></td>';
      const here = occ.filter(o => o.date === d && periodOf(o.start) === p.n);
      if (!here.length) return '<td></td>';
      return here.map(o => {
        const l = o.lesson;
        if (o.cancelled) return `<td class="lesscell c-${o.course.color}"><span class="cs">${esc(cname(o.course))}</span><i>entfällt</i></td>`;
        return `<td class="lesscell c-${o.course.color}"><span class="cs">${esc(cname(o.course))}${o.room ? ' · ' + esc(o.room) : ''}</span>${l ? `<b>${esc(l.title)}</b>${P.detail === 'voll' ? `${l.content ? `<div class="ct">${sanitize(l.content)}</div>` : ''}${l.material ? `<div class="ct"><i>Material:</i> ${sanitize(l.material)}</div>` : ''}${l.homework ? `<div class="ct"><i>HÜ:</i> ${sanitize(l.homework)}</div>` : ''}` : ''}` : ''}</td>`;
      }).join('');
    }).join('')}</tr>`;
  });
  h += '</tbody></table>';
  const note = D.weekNotes[wk];
  if (note) h += `<p style="font-size:9pt;margin-top:4mm"><b>Wochennotiz:</b> ${esc(note)}</p>`;
  return `<div class="sheet landscape">${h}</div>`;
}

function adoptCourses(cls) {
  const own = new Set(cls.students.map(nkey));
  return D.courses.filter(c => courseHasClass(c, cls.id) && courseStudents(c).some(st => !cls.students.includes(st) && nkey(st).trim() && !own.has(nkey(st))));
}
// Kinder eines Fachs in die Klassenliste kopieren. Sie bleiben auch in ihrer Stammklasse.
// Die Einträge des Fachs werden auf die neuen Listeneinträge umgeschrieben, damit nichts verloren geht.
function adoptIntoClass(cls, c) {
  const byKey = new Map(cls.students.filter(st => nkey(st).trim()).map(st => [nkey(st), st]));
  const map = {}; let added = 0;
  courseStudents(c).forEach(st => {
    if (cls.students.includes(st) || !nkey(st).trim()) return;
    let t = byKey.get(nkey(st));
    if (!t) { t = { id: uid(), last: st.last, first: st.first, number: '' }; cls.students.push(t); byKey.set(nkey(st), t); added++; }
    map[st.id] = t.id;
  });
  // leere Zeilen ohne Namen entfernen
  cls.students = cls.students.filter(st => nkey(st).trim());
  // Einträge, Anwesenheit, Noten und Hausübungen dieses Fachs umschreiben
  const move = obj => { if (!obj) return; Object.keys(map).forEach(o => { if (obj[o] !== undefined) { obj[map[o]] ??= obj[o]; delete obj[o]; } }); };
  Object.values(c.entries || {}).forEach(move);
  Object.values(c.attendance || {}).forEach(move);
  if (c.grades) Object.values(c.grades.values || {}).forEach(move);
  (c.homework || []).forEach(hw => move(hw.results));
  // Das Fach umfasst ab jetzt die ganze Klassenliste
  // (alle Kinder mit Namen stehen jetzt in der Liste, ganze Klassen und Einzelne von anderswo fallen weg)
  if (c.classId === cls.id) delete c.members; else c.members = [{ k: cls.id }];
  // Nummern vergeben, wenn die Liste noch keine hat
  if (!cls.students.some(st => String(st.number || '').trim())) studentsOf(cls).forEach((st, i) => { st.number = String(i + 1); });
  return added;
}

  return `${st.length} im Fach${main ? ` · ${own} aus ${esc(main.title)}` : ''}${other ? ` · ${other} aus anderen Klassen` : ''}`;
}

function popMenu(anchor, html) {

  const r = anchor.getBoundingClientRect(); const ph = p.offsetHeight, pw = p.offsetWidth;
  p.style.left = Math.max(8, Math.min(innerWidth - pw - 8, r.right - pw)) + 'px';
  p.style.top = (r.bottom + 6 + ph > innerHeight - 8 ? Math.max(8, r.top - ph - 6) : r.bottom + 6) + 'px';
}

let drag = null;
function dragClear() { $$('.drop-before,.drop-after,.drop-into').forEach(x => x.classList.remove('drop-before', 'drop-after', 'drop-into')); }
document.addEventListener('pointerdown', ev => {
  const h = ev.target.closest('.lrow .drag'); if (!h || ev.button > 0) return;
  ev.preventDefault();
  drag = { c: h.dataset.c, l: h.dataset.l, row: h.closest('.lrow'), target: null, y: ev.clientY, timer: null };
  drag.row.classList.add('dragging'); document.body.classList.add('is-dragging');
  try { h.setPointerCapture(ev.pointerId); } catch (e) { }
  // am Rand automatisch scrollen
  drag.timer = setInterval(() => { const m = $('.main'); if (!m || !drag) return; const r = m.getBoundingClientRect(); if (drag.y < r.top + 70) m.scrollTop -= 14; else if (drag.y > r.bottom - 70) m.scrollTop += 14; }, 30);
});
document.addEventListener('pointermove', ev => {
  if (!drag) return;
  drag.y = ev.clientY; dragClear(); drag.target = null;
  const el = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('.lrow[data-l], .uh[data-u]');
  if (!el || el === drag.row) return;
  if (el.dataset.u) { el.classList.add('drop-into'); drag.target = { u: el.dataset.u }; return; }
  const r = el.getBoundingClientRect(); const before = ev.clientY < r.top + r.height / 2;
  el.classList.add(before ? 'drop-before' : 'drop-after'); drag.target = { l: el.dataset.l, before };
});
function dragEnd(ev) {
  if (!drag) return;
  const d = drag; drag = null; clearInterval(d.timer); dragClear();
  d.row.classList.remove('dragging'); document.body.classList.remove('is-dragging');
  if (ev.type !== 'pointerup' || !d.target) return;
  const c = courseById(d.c); const src = findLesson(c, d.l); if (!src.l) return;
  commit(() => {
    src.u.lessons.splice(src.u.lessons.indexOf(src.l), 1);
    if (d.target.u) { const t = c.units.find(x => x.id === d.target.u); t.lessons.unshift(src.l); ui.openUnits[t.id] = true; }
    else { const t = findLesson(c, d.target.l); t.u.lessons.splice(t.u.lessons.indexOf(t.l) + (d.target.before ? 0 : 1), 0, src.l); }
  });
  toast('Stunde verschoben');
}
document.addEventListener('pointerup', dragEnd);
document.addEventListener('pointercancel', dragEnd);
